<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeruu Collections | Premium Thrift Bags</title>
    <style>
        :root {
            --primary: #111111;
            --accent: #ff4757;
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 100px;
        }

        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            color: #a4b0be;
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .card-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #333333;
        }

        .btn:disabled {
            background: #ced6e0;
            cursor: not-allowed;
        }

        /* Floating AI Button */
        .ai-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
            z-index: 1000;
        }

        /* AI Chat Window */
        .ai-chat {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            height: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .ai-chat.active {
            display: flex;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.user {
            background: #dfe4ea;
            align-self: flex-end;
        }

        .msg.bot {
            background: #ffeff1;
            color: #b31b28;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid #eee;
            padding: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>JERUU COLLECTIONS</h1>
        <p>Thrift Bags Curated from Trending Styles</p>
    </header>

    <div class="container">
        <div id="bags-grid" class="grid">
            <!-- Dynamic bags injected here -->
        </div>
    </div>

    <!-- AI Chat Elements -->
    <button class="ai-toggle" onclick="toggleChat()">💬</button>
    <div id="aiChat" class="ai-chat">
        <div class="chat-header">Priced AI Assistant</div>
        <div id="chatMessages" class="chat-messages">
            <div class="msg bot">Hello! Ask me about bag availability, pricing, or calculate shipping costs!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask Priced AI..." onkeypress="handleKey(event)">
            <button onclick="sendToAI()">Send</button>
        </div>
    </div>

    <script>
        // Load Inventory From Backend
        async function loadBags() {
            try {
                const response = await fetch('/api/bags');
                const bags = await response.json();
                const grid = document.getElementById('bags-grid');
                grid.innerHTML = '';

                bags.forEach(bag => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${bag.image}" alt="${bag.name}">
                            <div class="card-body">
                                <div class="card-title">${bag.name}</div>
                                <div class="card-price">KSh ${bag.price}</div>
                                <button class="btn" ${!bag.available ? 'disabled' : ''} onclick="reserveBag(${bag.id})">
                                    ${bag.available ? 'Claim Instantly' : 'SOLD OUT'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading catalogue profiles:", err);
            }
        }

        // Reserve Item Actions
        async function reserveBag(id) {
            try {
                const response = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await response.json();
                alert(data.message);
                loadBags(); // Refresh display state instantly
            } catch (err) {
                alert("Reservation processing error.");
            }
        }

        // Toggle Chat Visibility
        function toggleChat() {
            document.getElementById('aiChat').classList.toggle('active');
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendToAI();
        }

        // Communication Interface for Priced AI
        async function sendToAI() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');
            
            // Render user text bubble
            chatMessages.innerHTML += `<div class="msg user">${message}</div>`;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                // Render agent text bubble
                chatMessages.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                chatMessages.innerHTML += `<div class="msg bot">Connection dropped. Please retry.</div>`;
            }
        }

        // Initialization
        window.onload = loadBags;
    </script>
</body>
</html>
