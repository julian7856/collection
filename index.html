<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeruu Collections | Thrift Bags</title>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --primary: #8b5cf6;
            --primary-hover: #a78bfa;
            --accent: #ff477e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* Login Screen Overlay */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2e1065 0%, #0f0c1b 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2d264d;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }

        #login-box h2 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main App Content */
        #main-app {
            display: none;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #2e1065;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            position: absolute;
            top: 20px; right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-profile img {
            width: 32px; height: 32px;
            border-radius: 50%;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
            gap: 30px;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .shop-section h2, .ai-section h3 {
            font-size: 1.6rem;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2d264d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.15);
        }

        .image-container {
            position: relative;
            width: 100%; padding-top: 100%;
            background: #251f3b;
        }

        .card img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-hover);
            margin-bottom: 15px;
        }

        .payment-instructions {
            background: #25183a;
            border: 1px solid #4c2885;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: auto;
            margin-bottom: 15px;
            color: #d8b4fe;
            line-height: 1.5;
        }

        .payment-instructions b {
            color: #fff;
            background: #6b21a8;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .shipping-rates {
            margin-top: 5px;
            font-size: 0.8rem;
            color: #a78bfa;
            border-top: 1px dashed #4c2885;
            padding-top: 5px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
            color: white; border: none; padding: 12px;
            text-align: center; font-size: 1rem; font-weight: 600;
            cursor: pointer; border-radius: 8px; width: 100%;
        }

        .sold-out-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 12, 27, 0.85);
            backdrop-filter: blur(4px);
            color: var(--accent);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: 800; letter-spacing: 2px;
            z-index: 2; border: 2px solid var(--accent); border-radius: 12px;
        }

        .ai-section {
            background: var(--card-bg); border-radius: 12px; padding: 20px;
            border: 1px solid #2d264d; height: 600px; display: flex; flex-direction: column;
        }

        #chat-window {
            flex: 1; overflow-y: auto; border: 1px solid #2d264d; padding: 15px;
            margin-bottom: 15px; border-radius: 8px; background: #120e22;
            display: flex; flex-direction: column; gap: 12px;
        }

        .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 0.95rem; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; }
        .msg.ai { background: #251f3b; color: var(--text-main); align-self: flex-start; border: 1px solid #372f56; }
        .chat-input-container { display: flex; gap: 10px; }
        .chat-input-container input { flex: 1; padding: 12px; background: #120e22; border: 1px solid #2d264d; border-radius: 8px; color: white; }
        .chat-input-container .btn { width: auto; padding: 0 20px; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
    <div id="login-box">
        <h2>Jeruu Collections</h2>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Sign in with Google to browse and purchase exclusive TikTok thrift bags.</p>
        <div id="g_id_onload"
             data-client_id="205585516210-sk72oka4jppvr4micfes5m9dkvd27f1o.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_select="true">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_dark" data-size="large" data-width="100%"></div>
    </div>
</div>

<!-- Main App Content -->
<div id="main-app">
    <header>
        <h1>Jeruu Collections</h1>
        <p>Premium Thrift Bags Sourced Directly From TikTok</p>
        <div class="user-profile">
            <img id="user-avatar" src="" alt="Avatar">
            <span id="user-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="shop-section">
            <h2>Available Thrift Items</h2>
            <div class="grid" id="bags-grid"></div>
        </div>

        <div class="ai-section">
            <h3>Priced AI Side</h3>
            <div id="chat-window">
                <div class="msg ai">Hey! I'm Priced AI. Ask me anything about Jeruu's bags or delivery fees to Nakuru and Free Area!</div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="ai-input" placeholder="Ask Priced AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    function decodeJwt(token) {
        try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
    }

    function handleCredentialResponse(response) {
        const userData = decodeJwt(response.credential);
        if (userData) {
            localStorage.setItem('jeruu_user', JSON.stringify({
                name: userData.name,
                picture: userData.picture
            }));
            showApp(userData.name, userData.picture);
        }
    }

    function showApp(name, picture) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').src = picture;
        loadBags();
    }

    function logout() {
        localStorage.removeItem('jeruu_user');
        window.location.reload();
    }

    window.onload = function() {
        const savedUser = localStorage.getItem('jeruu_user');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            showApp(user.name, user.picture);
        }
    };

    async function loadBags() {
        const response = await fetch('/api/bags');
        const bags = await response.json();
        const grid = document.getElementById('bags-grid');
        grid.innerHTML = '';

        bags.forEach(bag => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (!bag.available) {
                const overlay = document.createElement('div');
                overlay.className = 'sold-out-overlay';
                overlay.innerText = 'SOLD OUT';
                card.appendChild(overlay);
            }

            card.innerHTML += `
                <div class="image-container">
                    <img src="${bag.image}" alt="${bag.name}">
                </div>
                <div class="card-content">
                    <h3>${bag.name}</h3>
                    <div class="price">KSh ${bag.price}</div>
                    ${bag.available ? `
                        <div class="payment-instructions">
                            <b>M-Pesa</b> Pay to <b>0790218482</b>, then call to confirm!
                            <div class="shipping-rates">
                                🚚 Shipping: Nakuru: KSh 1,000 | Free Area: KSh 534
                            </div>
                        </div>
                        <button class="btn" onclick="buyBag(${bag.id})">Confirm Purchase</button>
                    ` : ''}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function buyBag(id) {
        const response = await fetch('/api/buy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const result = await response.json();
        if(result.success) {
            alert("Order flagged system-wide! Call 0790218482 right now to finalize your purchase.");
            loadBags();
        }
    }

    async function sendMessage() {
        const input = document.getElementById('ai-input');
        const chatWindow = document.getElementById('chat-window');
        const message = input.value.trim();
        if(!message) return;

        chatWindow.innerHTML += `<div class="msg user">${message}</div>`;
        input.value = '';
        chatWindow.scrollTop = chatWindow.scrollHeight;

        const response = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });
        const data = await response.json();
        chatWindow.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>

</body>
</html>
