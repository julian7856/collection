<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeruu Collections | Premium Thrift Bags</title>
    <style>
        :root {
            --bg-dark: #0b0914;
            --panel-bg: rgba(22, 19, 38, 0.75);
            --accent-purple: #9d4edd;
            --neon-glow: #c77dff;
            --text-light: #f7f4f9;
            --text-muted: #a499b3;
            --border-purple: rgba(157, 78, 221, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 20%, rgba(76, 41, 122, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(157, 78, 221, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            padding-bottom: 100px;
        }

        /* Aesthetic Purple Hero Header */
        header {
            background: rgba(16, 12, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-purple);
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Main Grid Wrapper */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }

        /* Glowing Purple Premium Card Design */
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-purple);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-glow);
            box-shadow: 0 15px 40px rgba(157, 78, 221, 0.25);
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #131024;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        /* Neon Label Badge */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #7b2cbf 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge.sold-out {
            background: #312a42;
            color: #7a718c;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-light);
            line-height: 1.4;
            min-height: 56px;
        }

        .card-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--neon-glow);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.2);
        }

        .card-price span {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 2px;
        }

        /* Glassmorphism Neon Control Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #6a0dad 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            margin-top: auto;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #b55fe6 0%, var(--accent-purple) 100%);
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.6);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #201a30;
            color: #534c61;
            border-color: rgba(255, 255, 255, 0.02);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Floating AI Action Bubble */
        .ai-toggle {
            position: fixed;
            bottom: 35px;
            right: 35px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--neon-glow) 100%);
            color: white;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .ai-toggle:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Gorgeous Purple AI Chat Terminal */
        .ai-chat {
            position: fixed;
            bottom: 115px;
            right: 35px;
            width: 380px;
            height: 520px;
            background: rgba(18, 14, 36, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid var(--border-purple);
        }

        .ai-chat.active {
            display: flex;
        }

        .chat-header {
            background: rgba(28, 22, 54, 0.8);
            border-bottom: 1px solid var(--border-purple);
            color: white;
            padding: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #39ff14;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #39ff14;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: rgba(11, 9, 20, 0.4);
        }

        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .msg.user {
            background: var(--accent-purple);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.2);
        }

        .msg.bot {
            background: rgba(36, 29, 66, 0.6);
            color: var(--text-light);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(157, 78, 221, 0.15);
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-purple);
            padding: 15px;
            background: rgba(18, 14, 36, 0.8);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(11, 9, 20, 0.6);
            border: 1px solid var(--border-purple);
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            color: white;
            transition: all 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-glow);
            box-shadow: 0 0 10px rgba(199, 125, 255, 0.2);
        }

        .chat-input-area button {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 10px rgba(157, 78, 221, 0.2);
        }

        .chat-input-area button:hover {
            background: var(--neon-glow);
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.4);
        }

        @media (max-width: 480px) {
            .ai-chat {
                width: calc(100% - 40px);
                right: 20px;
                left: 20px;
                bottom: 100px;
                height: 450px;
            }
            .ai-toggle {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>JERUU COLLECTIONS</h1>
        <p>Premium thrift bags curated directly from trending global styles. Fast delivery across Kenya.</p>
    </header>

    <div class="container">
        <div id="bags-grid" class="grid">
            <!-- Dynamic items load here -->
        </div>
    </div>

    <!-- Floating Bubble AI Component -->
    <button class="ai-toggle" onclick="toggleChat()">💬</button>
    <div id="aiChat" class="ai-chat">
        <div class="chat-header">Priced AI Assistant</div>
        <div id="chatMessages" class="chat-messages">
            <div class="msg bot">Welcome to Jeruu Collections! I can help you check bag stock, review pricing, or compute your instant local shipping rates. What's on your mind?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask Priced AI..." onkeypress="handleKey(event)">
            <button onclick="sendToAI()">Send</button>
        </div>
    </div>

    <script>
        // Load Catalog Elements From API Route
        async function loadBags() {
            try {
                const response = await fetch('/api/bags');
                const bags = await response.json();
                const grid = document.getElementById('bags-grid');
                grid.innerHTML = '';

                bags.forEach(bag => {
                    grid.innerHTML += `
                        <div class="card">
                            <div class="img-container">
                                <img src="${bag.image}" alt="${bag.name}">
                                <span class="badge ${!bag.available ? 'sold-out' : ''}">
                                    ${bag.available ? 'Trending' : 'Sold Out'}
                                </span>
                            </div>
                            <div class="card-body">
                                <div class="card-title">${bag.name}</div>
                                <div class="card-price"><span>KSh</span> ${bag.price}</div>
                                <button class="btn" ${!bag.available ? 'disabled' : ''} onclick="reserveBag(${bag.id})">
                                    ${bag.available ? 'Claim &amp; Reserve' : 'SOLD OUT'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error connecting to inventory server:", err);
            }
        }

        // Handle Claim and Reservations
        async function reserveBag(id) {
            try {
                const response = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const data = await response.json();
                alert(data.message);
                loadBags(); 
            } catch (err) {
                alert("Could not process your item claim.");
            }
        }

        // Control Floating Widget Display
        function toggleChat() {
            document.getElementById('aiChat').classList.toggle('active');
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendToAI();
        }

        // Bridge request channels to serverless AI module
        async function sendToAI() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div class="msg user">${message}</div>`;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                chatMessages.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                chatMessages.innerHTML += `<div class="msg bot">Communication dropped. Please try again.</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        window.onload = loadBags;
    </script>
</body>
</html>
